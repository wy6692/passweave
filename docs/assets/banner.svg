<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#27272A" />
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="16" fill="#09090B" />
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.25" stroke="#27272A" stroke-width="1.5" />
  <rect x="24" y="24" width="1152" height="312" fill="url(#grid)" opacity="0.65" />

  <!-- Brand Lockup Left -->
  <g transform="translate(84, 86)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#111113" stroke="#27272A" stroke-width="1.5" />
    <g transform="translate(6, 6)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 17.25 40 L 17 40 A 8 8 0 0 1 17 24 L 33.25 24" stroke="#F4F4F5" />
      <path d="M 46.75 24 L 47 24 A 8 8 0 0 1 47 40 L 30.75 40" stroke="#F4F4F5" />
      <path d="M 24 17.25 L 24 17 A 8 8 0 0 1 40 17 L 40 33.25" stroke="#14B8A6" />
      <path d="M 40 46.75 L 40 47 A 8 8 0 0 1 24 47 L 24 30.75" stroke="#14B8A6" />
      <path d="M 32 29.2 L 34.8 32 L 32 34.8 L 29.2 32 Z" fill="#14B8A6" />
    </g>

    <text x="0" y="128" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.03em">
      PassWeave
    </text>
    <text x="218" y="126" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500">
      / 织密
    </text>
    <text x="0" y="164" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="400">
      Human-computable, breach-isolated password patterns. Zero network I/O.
    </text>
  </g>

  <!-- Right Token Anatomy Diagram -->
  <g transform="translate(650, 74)">
    <rect x="0" y="0" width="466" height="212" rx="12" fill="#111113" stroke="#27272A" stroke-width="1.5" />
    <line x1="0" y1="40" x2="466" y2="40" stroke="#27272A" stroke-width="1" />
    <circle cx="20" cy="20" r="4" fill="#3F3F46" />
    <circle cx="34" cy="20" r="4" fill="#3F3F46" />
    <circle cx="48" cy="20" r="4" fill="#3F3F46" />
    <text x="346" y="25" fill="#14B8A6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.06em">
      CSP: CONNECT-SRC NONE
    </text>

    <text x="24" y="72" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
      TARGET: github.com  ·  TIER 2 (STANDARD)
    </text>

    <!-- Token Pills -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="96" height="44" rx="6" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-opacity="0.4" />
      <text x="48" y="28" text-anchor="middle" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">Cedar</text>

      <rect x="104" y="0" width="40" height="44" rx="6" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.35" />
      <text x="124" y="28" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">#</text>

      <rect x="152" y="0" width="84" height="44" rx="6" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.4" />
      <text x="194" y="28" text-anchor="middle" fill="#FCD34D" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">Gt2</text>

      <rect x="244" y="0" width="40" height="44" rx="6" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.35" />
      <text x="264" y="28" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">!</text>

      <rect x="292" y="0" width="72" height="44" rx="6" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-opacity="0.4" />
      <text x="328" y="28" text-anchor="middle" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">84</text>
    </g>

    <!-- Token Labels -->
    <g transform="translate(24, 154)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#71717A">
      <text x="48" y="0" text-anchor="middle">ANCHOR_HEAD</text>
      <text x="194" y="0" text-anchor="middle" fill="#FBBF24">SITE_TOKEN</text>
      <text x="328" y="0" text-anchor="middle">ANCHOR_TAIL</text>
    </g>

    <text x="24" y="188" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
      github -&gt; consonants(G,t) + vowels(2) = Gt2  [~2.6s recall]
    </text>
  </g>
</svg>
